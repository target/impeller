name: Publish Docker image

on:
  release:
    types: [published]

jobs:
  publish_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: target/impeller
          flavor: |
            latest=auto
            prefix=
            suffix=
      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Extract metadata (tags, labels) for Docker gcloud
        id: meta-g
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: target/impeller
          flavor: |
            latest=auto
            prefix=
            suffix=gcloud

      - name: Build and push Docker image gcloud
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ./Dockerfile-gcloud
          push: true
          tags: ${{ steps.meta-g.outputs.tags }}
          labels: ${{ steps.meta-g.outputs.labels }}
